name: Build SabetNet APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

env:
  # Native sources, pinned to the exact revisions this v2rayNG snapshot was built against.
  XRAY_LIB_REPO: https://github.com/2dust/AndroidLibXrayLite
  XRAY_LIB_COMMIT: 76a6e2172210613fcb4aa32b6de55bcd9452ce43
  HEV_REPO: https://github.com/heiher/hev-socks5-tunnel
  HEV_COMMIT: d9dca26c7ad0e494492244f0309e80ee583e739e

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Fetch native sources (pinned)
      run: |
        rm -rf AndroidLibXrayLite hev-socks5-tunnel
        git clone "$XRAY_LIB_REPO" AndroidLibXrayLite
        git -C AndroidLibXrayLite checkout "$XRAY_LIB_COMMIT"
        git clone "$HEV_REPO" hev-socks5-tunnel
        git -C hev-socks5-tunnel checkout "$HEV_COMMIT"
        git -C hev-socks5-tunnel submodule update --init --recursive

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4
      with:
        log-accepted-android-sdk-licenses: false
        cmdline-tools-version: '14742923'
        packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'

    - name: Install NDK
      run: |
        echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
          --channel=0 \
          --install "ndk;30.0.16248370"
        echo "NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> $GITHUB_ENV
        # Pin the NDK version inside the android { } block (whitespace is irrelevant in Kotlin DSL).
        sed -i '/^android {/a ndkVersion = "30.0.16248370"' "${{ github.workspace }}/V2rayNG/app/build.gradle.kts"

    - name: Restore cached libhevtun
      id: cache-libhevtun-restore
      uses: actions/cache/restore@v6
      with:
        path: ${{ github.workspace }}/libs
        key: libhevtun-${{ runner.os }}-${{ env.NDK_HOME }}-${{ env.HEV_COMMIT }}-${{ hashFiles('compile-hevtun.sh') }}

    - name: Build libhevtun
      if: steps.cache-libhevtun-restore.outputs.cache-hit != 'true'
      run: |
        bash compile-hevtun.sh

    - name: Save libhevtun
      if: steps.cache-libhevtun-restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ github.workspace }}/libs
        key: libhevtun-${{ runner.os }}-${{ env.NDK_HOME }}-${{ env.HEV_COMMIT }}-${{ hashFiles('compile-hevtun.sh') }}

    - name: Copy libhevtun
      run: |
        cp -r ${{ github.workspace }}/libs ${{ github.workspace }}/V2rayNG/app

    - name: Find AndroidLibXrayLite release tag
      run: |
        pushd AndroidLibXrayLite
        CURRENT_TAG=$(git describe --tags --abbrev=0)
        echo "Current tag in this repo: $CURRENT_TAG"
        echo "CURRENT_TAG=$CURRENT_TAG" >> $GITHUB_ENV
        popd

    - name: Download libv2ray
      uses: robinraju/release-downloader@v1.13
      with:
        repository: '2dust/AndroidLibXrayLite'
        tag: ${{ env.CURRENT_TAG }}
        fileName: 'libv2ray.aar'
        out-file-path: V2rayNG/app/libs/

    - name: Setup Java
      uses: actions/setup-java@v6.1.0
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Prepare signing key
      env:
        KS_B64: ${{ secrets.APP_KEYSTORE_BASE64 }}
        SECRET_KS_PASS: ${{ secrets.APP_KEYSTORE_PASSWORD }}
        SECRET_KS_ALIAS: ${{ secrets.APP_KEYSTORE_ALIAS }}
        SECRET_KEY_PASS: ${{ secrets.APP_KEY_PASSWORD }}
      run: |
        KS_FILE="$RUNNER_TEMP/release.jks"
        if [ -n "$KS_B64" ]; then
          # Secrets are often pasted with stray spaces or line breaks; strip them before use.
          printf '%s' "$KS_B64" | tr -d ' \r\n\t' | base64 -d > "$KS_FILE" \
            || { echo "::error::APP_KEYSTORE_BASE64 is not valid base64. Paste the whole single line from keystore_base64.txt."; exit 1; }
          KS_PASS=$(printf '%s' "$SECRET_KS_PASS" | tr -d '\r\n')
          KS_ALIAS=$(printf '%s' "$SECRET_KS_ALIAS" | tr -d ' \r\n')
          KEY_PASS=$(printf '%s' "$SECRET_KEY_PASS" | tr -d '\r\n')
          if ! keytool -list -keystore "$KS_FILE" -storepass "$KS_PASS" -alias "$KS_ALIAS" >/dev/null 2>&1; then
            echo "::error::Cannot open the keystore. Check APP_KEYSTORE_PASSWORD, APP_KEYSTORE_ALIAS (novanet) and APP_KEYSTORE_BASE64."
            exit 1
          fi
        else
          echo "::warning::No signing secrets configured, using a temporary key. Each build gets a different signature, so a new APK can only be installed after uninstalling the previous one. Add the APP_KEYSTORE_* secrets to fix this."
          KS_PASS="novanet-temp-pass"; KS_ALIAS="novanet"; KEY_PASS="$KS_PASS"
          keytool -genkeypair -keystore "$KS_FILE" -storepass "$KS_PASS" -keypass "$KEY_PASS" \
            -alias "$KS_ALIAS" -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=SabetNet"
        fi
        {
          echo "KS_FILE=$KS_FILE"
          echo "KS_PASS=$KS_PASS"
          echo "KS_ALIAS=$KS_ALIAS"
          echo "KEY_PASS=$KEY_PASS"
        } >> "$GITHUB_ENV"

    - name: Build APK
      run: |
        set -o pipefail
        cd ${{ github.workspace }}/V2rayNG
        echo "sdk.dir=${ANDROID_HOME}" > local.properties
        chmod 755 gradlew
        ./gradlew licenseFdroidReleaseReport
        ./gradlew assemblePlaystoreRelease \
          -Pandroid.injected.signing.store.file="$KS_FILE" \
          -Pandroid.injected.signing.store.password="$KS_PASS" \
          -Pandroid.injected.signing.key.alias="$KS_ALIAS" \
          -Pandroid.injected.signing.key.password="$KEY_PASS" 2>&1 | tee "${{ github.workspace }}/build.log"

    - name: Show compile errors
      if: ${{ failure() }}
      run: |
        # Surfaces Kotlin/Gradle errors as annotations so they are visible without opening the full log.
        grep -E "^e: |error:|What went wrong|Execution failed" -A2 build.log | head -40 | sed 's/%/%25/g' | while IFS= read -r line; do echo "::error::${line}"; done | head -10

    - name: Unit tests
      continue-on-error: true
      run: |
        set -o pipefail
        cd ${{ github.workspace }}/V2rayNG
        ./gradlew :app:testPlaystoreDebugUnitTest 2>&1 | tee "${{ github.workspace }}/test.log" | tail -5
        status=$?
        exit $status

    - name: Show test failures
      if: ${{ always() }}
      run: |
        if grep -qE "FAILED|BUILD FAILED" test.log 2>/dev/null; then
          grep -E "FAILED|^e: |AssertionFailed|expected:" test.log | head -10 | sed 's/%/%25/g' | while IFS= read -r line; do echo "::error::${line}"; done
        else
          echo "::notice::Unit tests passed"
        fi

    # The Actions artifact quota can be exhausted by large APKs; a release asset is not counted against it,
    # so the newest build is also published as the (private-repo) pre-release "latest-build".
    - name: Publish APKs as latest-build release
      if: ${{ success() }}
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release delete latest-build --cleanup-tag --yes || true
        gh release create latest-build --prerelease --target "$GITHUB_SHA" \
          --title "Latest build" --notes "Build of ${GITHUB_SHA::7}" \
          "${{ github.workspace }}"/V2rayNG/app/build/outputs/apk/playstore/release/*.apk

    - name: Upload APKs
      uses: actions/upload-artifact@v7
      if: ${{ success() }}
      continue-on-error: true
      with:
        name: SabetNet-apks
        retention-days: 3
        path: ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/playstore/release/*.apk
