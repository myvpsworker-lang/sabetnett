name: Build NovaNet APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

env:
  # Native sources, pinned to the exact revisions this v2rayNG snapshot was built against.
  XRAY_LIB_REPO: https://github.com/2dust/AndroidLibXrayLite
  XRAY_LIB_COMMIT: 76a6e2172210613fcb4aa32b6de55bcd9452ce43
  HEV_REPO: https://github.com/heiher/hev-socks5-tunnel
  HEV_COMMIT: d9dca26c7ad0e494492244f0309e80ee583e739e

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Fetch native sources (pinned)
      run: |
        rm -rf AndroidLibXrayLite hev-socks5-tunnel
        git clone "$XRAY_LIB_REPO" AndroidLibXrayLite
        git -C AndroidLibXrayLite checkout "$XRAY_LIB_COMMIT"
        git clone "$HEV_REPO" hev-socks5-tunnel
        git -C hev-socks5-tunnel checkout "$HEV_COMMIT"
        git -C hev-socks5-tunnel submodule update --init --recursive

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4
      with:
        log-accepted-android-sdk-licenses: false
        cmdline-tools-version: '14742923'
        packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'

    - name: Install NDK
      run: |
        echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
          --channel=0 \
          --install "ndk;30.0.16248370"
        echo "NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> $GITHUB_ENV
        # Pin the NDK version inside the android { } block (whitespace is irrelevant in Kotlin DSL).
        sed -i '/^android {/a ndkVersion = "30.0.16248370"' "${{ github.workspace }}/V2rayNG/app/build.gradle.kts"

    - name: Restore cached libhevtun
      id: cache-libhevtun-restore
      uses: actions/cache/restore@v6
      with:
        path: ${{ github.workspace }}/libs
        key: libhevtun-${{ runner.os }}-${{ env.NDK_HOME }}-${{ env.HEV_COMMIT }}-${{ hashFiles('compile-hevtun.sh') }}

    - name: Build libhevtun
      if: steps.cache-libhevtun-restore.outputs.cache-hit != 'true'
      run: |
        bash compile-hevtun.sh

    - name: Save libhevtun
      if: steps.cache-libhevtun-restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ github.workspace }}/libs
        key: libhevtun-${{ runner.os }}-${{ env.NDK_HOME }}-${{ env.HEV_COMMIT }}-${{ hashFiles('compile-hevtun.sh') }}

    - name: Copy libhevtun
      run: |
        cp -r ${{ github.workspace }}/libs ${{ github.workspace }}/V2rayNG/app

    - name: Find AndroidLibXrayLite release tag
      run: |
        pushd AndroidLibXrayLite
        CURRENT_TAG=$(git describe --tags --abbrev=0)
        echo "Current tag in this repo: $CURRENT_TAG"
        echo "CURRENT_TAG=$CURRENT_TAG" >> $GITHUB_ENV
        popd

    - name: Download libv2ray
      uses: robinraju/release-downloader@v1.13
      with:
        repository: '2dust/AndroidLibXrayLite'
        tag: ${{ env.CURRENT_TAG }}
        fileName: 'libv2ray.aar'
        out-file-path: V2rayNG/app/libs/

    - name: Setup Java
      uses: actions/setup-java@v6.1.0
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Prepare signing key
      env:
        KS_B64: ${{ secrets.APP_KEYSTORE_BASE64 }}
        SECRET_KS_PASS: ${{ secrets.APP_KEYSTORE_PASSWORD }}
        SECRET_KS_ALIAS: ${{ secrets.APP_KEYSTORE_ALIAS }}
        SECRET_KEY_PASS: ${{ secrets.APP_KEY_PASSWORD }}
      run: |
        KS_FILE="$RUNNER_TEMP/release.jks"
        if [ -n "$KS_B64" ]; then
          printf '%s' "$KS_B64" | base64 -d > "$KS_FILE"
          KS_PASS="$SECRET_KS_PASS"; KS_ALIAS="$SECRET_KS_ALIAS"; KEY_PASS="$SECRET_KEY_PASS"
        else
          echo "::warning::No signing secrets configured, using a temporary key. Each build gets a different signature, so a new APK can only be installed after uninstalling the previous one. Add the APP_KEYSTORE_* secrets to fix this."
          KS_PASS="novanet-temp-pass"; KS_ALIAS="novanet"; KEY_PASS="$KS_PASS"
          keytool -genkeypair -keystore "$KS_FILE" -storepass "$KS_PASS" -keypass "$KEY_PASS" \
            -alias "$KS_ALIAS" -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=NovaNet"
        fi
        {
          echo "KS_FILE=$KS_FILE"
          echo "KS_PASS=$KS_PASS"
          echo "KS_ALIAS=$KS_ALIAS"
          echo "KEY_PASS=$KEY_PASS"
        } >> "$GITHUB_ENV"

    - name: Build APK
      run: |
        cd ${{ github.workspace }}/V2rayNG
        echo "sdk.dir=${ANDROID_HOME}" > local.properties
        chmod 755 gradlew
        ./gradlew licenseFdroidReleaseReport
        ./gradlew assemblePlaystoreRelease \
          -Pandroid.injected.signing.store.file="$KS_FILE" \
          -Pandroid.injected.signing.store.password="$KS_PASS" \
          -Pandroid.injected.signing.key.alias="$KS_ALIAS" \
          -Pandroid.injected.signing.key.password="$KEY_PASS"

    - name: Upload APKs
      uses: actions/upload-artifact@v7
      if: ${{ success() }}
      with:
        name: NovaNet-apks
        path: ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/playstore/release/*.apk
